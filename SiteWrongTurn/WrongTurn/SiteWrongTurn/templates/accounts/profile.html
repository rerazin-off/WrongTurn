{% extends 'base.html' %}

{% block title %}Профиль - Wrong Turn{% endblock %}
{% block body_class %}inner-page{% endblock %}
{% block layout %}
<div class="page-shell">
    <header class="site-header">
        <div>
            <a class="logo" href="{% url 'home' %}">Wrong Turn</a>
            <nav class="menu">
                <a href="{% url 'home' %}">Главная</a>
                <a href="{% url 'analytics' %}">Аналитика</a>
            </nav>
        </div>
        <a class="icon-link" href="{% url 'profile' %}" style="color:#f15766;"><i class="fa-regular fa-circle-user"></i></a>
    </header>
    <div class="page-content">
        <h2 class="mb-4">Личная информация:</h2>
        <div class="profile-grid">
            <div>
                <input class="form-input" value="{{ user.last_name }}" readonly>
                <input class="form-input" value="{{ user.first_name }}" readonly>
                <input class="form-input" value="{{ user.patronymic|default:'' }}" readonly>
                <input class="form-input" value="{{ user.email }}" readonly>
                <a href="{% url 'logout' %}" class="btn-dark-main text-decoration-none">Выйти</a>
            </div>
            <img class="profile-photo" src="https://images.unsplash.com/photo-1449965408869-eaa3f722e40d?w=900" alt="profile">
        </div>
    </div>
    <footer class="footer">
        <span>Переходи к нам!</span>
        <span><i class="fa-brands fa-instagram"></i> <i class="fa-brands fa-linkedin"></i> <i class="fa-brands fa-x-twitter"></i></span>
    </footer>
</div>
{% endblock %}
