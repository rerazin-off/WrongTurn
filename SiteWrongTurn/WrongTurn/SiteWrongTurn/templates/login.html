{% extends 'base.html' %}

{% block title %}Вход - Wrong Turn{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block content %}
<div>
    <h1 class="brand-title">Wrong Turn</h1>
    <div class="auth-card">
        <h3>Авторизация</h3>
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <input type="text" class="form-input" id="username" name="username" placeholder="Логин" required>
            <input type="password" class="form-input" id="password" name="password" placeholder="Пароль" required>
            <div class="text-center mb-2">
                <button type="submit" class="btn-dark-main">Войти</button>
            </div>
            <input type="hidden" name="next" value="{{ next }}">
        </form>
        <p class="auth-hint">Нет аккаунта? <a href="{% url 'register' %}">Регистрируйся!</a></p>
    </div>
</div>
{% endblock %}
