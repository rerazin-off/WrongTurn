{% extends 'base.html' %}

{% block title %}Регистрация - Wrong Turn{% endblock %}

{% block content %}
<div class="row justify-content-center fade-in">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header text-center">
                <i class="fas fa-user-plus fa-2x mb-2"></i>
                <h3 class="mb-0">Регистрация</h3>
                <p class="mb-0 mt-2">Начните подготовку к экзамену ПДД</p>
            </div>
            <div class="card-body p-4">
                <form method="post" action="{% url 'register' %}">
                    {% csrf_token %}
                    
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="last_name" class="form-label">
                                <i class="fas fa-user me-1"></i>Фамилия
                            </label>
                            <input type="text" 
                                   class="form-control" 
                                   id="last_name" 
                                   name="last_name" 
                                   placeholder="Иванов"
                                   required>
                        </div>
                        
                        <div class="col-md-4 mb-3">
                            <label for="first_name" class="form-label">
                                <i class="fas fa-user me-1"></i>Имя
                            </label>
                            <input type="text" 
                                   class="form-control" 
                                   id="first_name" 
                                   name="first_name" 
                                   placeholder="Иван"
                                   required>
                        </div>
                        
                        <div class="col-md-4 mb-3">
                            <label for="patronymic" class="form-label">
                                <i class="fas fa-user me-1"></i>Отчество
                            </label>
                            <input type="text" 
                                   class="form-control" 
                                   id="patronymic" 
                                   name="patronymic" 
                                   placeholder="Иванович">
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="username" class="form-label">
                            <i class="fas fa-id-card me-1"></i>Логин
                        </label>
                        <input type="text" 
                               class="form-control" 
                               id="username" 
                               name="username" 
                               placeholder="ivanov_ivan"
                               required>
                        <small class="text-muted">Только латиница, цифры и символы . - _</small>
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label">
                            <i class="fas fa-envelope me-1"></i>Email
                        </label>
                        <input type="email" 
                               class="form-control" 
                               id="email" 
                               name="email" 
                               placeholder="ivanov@example.com"
                               required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="birthday" class="form-label">
                            <i class="fas fa-calendar-alt me-1"></i>Дата рождения
                        </label>
                        <input type="date" 
                               class="form-control" 
                               id="birthday" 
                               name="birthday">
                    </div>
                    
                    <div class="mb-3">
                        <label for="password1" class="form-label">
                            <i class="fas fa-lock me-1"></i>Пароль
                        </label>
                        <input type="password" 
                               class="form-control" 
                               id="password1" 
                               name="password1" 
                               placeholder="Создайте пароль"
                               required>
                        <small class="text-muted">
                            Пароль должен содержать минимум 8 символов
                        </small>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password2" class="form-label">
                            <i class="fas fa-lock me-1"></i>Подтверждение пароля
                        </label>
                        <input type="password" 
                               class="form-control" 
                               id="password2" 
                               name="password2" 
                               placeholder="Повторите пароль"
                               required>
                    </div>
                    
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="agree" required>
                        <label class="form-check-label" for="agree">
                            Я соглашаюсь с 
                            <a href="#" class="text-decoration-none">условиями использования</a> 
                            и 
                            <a href="#" class="text-decoration-none">политикой конфиденциальности</a>
                        </label>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-user-plus me-2"></i>Зарегистрироваться
                    </button>
                </form>
                
                <div class="text-center mt-4">
                    <p class="text-muted">
                        Уже есть аккаунт? 
                        <a href="{% url 'login' %}" class="text-decoration-none">
                            Войти
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Валидация пароля на клиенте
    document.querySelector('form').addEventListener('submit', function(e) {
        var password1 = document.getElementById('password1').value;
        var password2 = document.getElementById('password2').value;
        
        if (password1 !== password2) {
            e.preventDefault();
            alert('Пароли не совпадают!');
        } else if (password1.length < 8) {
            e.preventDefault();
            alert('Пароль должен содержать минимум 8 символов!');
        }
    });
</script>
{% endblock %}
